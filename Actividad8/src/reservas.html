    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <header>
        <a href="./index.html" aria-label="Ir al inicio">
            <img src="./recursos/imagenes/logo-rs.svg" alt="Logo cabaña">
        </a>
        <nav>
            <a  href="./index.html">
                Inicio

              <a  href="./reservas.html">
                Reservas
              </a>
        </nav>
    </header>
    <main>
        <h1>Reservas</h1>
        <h2>Contactanos</h4>
        <div class="contenido-principal contenedor-form form">
            <form action="./contacto.html" method="post">
                <label for="id_nobre">Nombre</label>
                <input type="text" name="nombre" id="id_nombre">
                
                <label for="id_telefono">Teléfono</label>
                <input type="tel" name="telefono" id="id_telefono">
                
                
                <label for="id_email">Email</label>
                <input type="text" name="email" id="id_email">
                
                <label for="id_fechaInicio">Fecha desde</label>
                <input type="date" name="fechainicio" id="id_fechadesde">
                
                  <label for="id_fechaFin">Fecha hasta</label>
                <input type="date" name="fechafin" id="id_fechahasta">

                <label for="id_comentario">Comentario</label>
                <textarea name="comentario" id="id_comentario"></textarea>
            <div>
                    <button type="reset">
                        Limpiar
                    </button>

                    <button type="submit">
                        Enviar
                    </button>
            </div>
        </form>
    </main>
