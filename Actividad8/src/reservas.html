
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro Sustentable - Reservas</title>
    <link rel="stylesheet" href="./recursos/css/index.css">
</head>
<body>
    <!-- Se mantiene la misma estructura semántica del header para consistencia (Layout general) -->
    <header class="encabezado-principal">
        <a href="./index.html" aria-label="Ir al inicio">
            <img src="./recursos/imagenes/logo-rs.svg" alt="Logo cabaña">
        </a>
        <nav>
            <a href="./index.html">Inicio</a>
            <a href="./reservas.html">Reservas</a>
        </nav>
    </header>
    <main>
        <h1>Reservas</h1>
        <h2>Contactanos</h2>
        <div class="contenido-principal contenedor-form form">
            <!-- Formulario con sus atributos action y method correctos para el envío de datos -->
            <form action="./contacto.html" method="get">
                <!-- Se asocia cada label con su input correspondiente' -->
                <label for="id_nombre">Nombre</label>
                <input type="text" name="nombre" id="id_nombre">
                
                <label for="id_telefono">Teléfono</label>
                <input type="tel" name="telefono" id="id_telefono">
                
                <label for="id_email">Email</label>
                <input type="email" name="email" id="id_email">
                
                <label for="id_fechaInicio">Fecha desde</label>
                <input type="date" name="fechaInicio" id="id_fechaInicio">
                
                <label for="id_fechaFin">Fecha hasta</label>
                <input type="date" name="fechaFin" id="id_fechaFin">

                <label for="id_comentario">Comentario</label>
                <textarea name="comentario" id="id_comentario"></textarea>
                
                <div>
                    <button type="reset">Limpiar</button>
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </div>
    </main>
    <footer class="pie-principal">
        <ul>
            <li>
                 <p>&copy; 2026 Retiro Sustentable. Todos los derechos reservados.</p>
            </li>
            <li> 
                <a href="https://instagram.com/@RetiroSustentable" target="_blank">
                    @RetiroSustentable
                </a>
            </li>
            <li>San Javier, Traslasierra, RP14, X5875, Córdoba</li>
        </ul>
    </footer>
</body>
</html>
